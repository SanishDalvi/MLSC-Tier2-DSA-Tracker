name: Update Team DSA Leaderboard

on:
  schedule:
    # Runs daily at 11:30 PM IST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tracker Script
        run: python track_team.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update team stats [skip ci]" || exit 0
          git push
